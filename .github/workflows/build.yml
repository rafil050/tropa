name: Сборка

# Каждая отправка в main — сборка Tropa.exe и тесты на Windows, упаковка установщика.
# Если номера версии из tropa/__init__.py ещё нет среди релизов — релиз публикуется автоматически.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"          # русский текст в выводе скриптов и тестов
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Версия
        shell: pwsh
        run: |
          $v = python -c "from tropa import APP_VERSION; print(APP_VERSION)"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:GITHUB_REF -like "refs/tags/*" -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Метка $env:GITHUB_REF_NAME не совпадает с версией в tropa/__init__.py ($v)"
          }

      - name: Сборка Tropa.exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name Tropa
          --icon tropa\assets\icon.ico
          --add-data "tropa\assets;tropa\assets"
          --version-file packaging\version_info.txt
          --exclude-module tkinter --exclude-module unittest --exclude-module pydoc
          main.py

      - name: Ядро Xray (с проверкой SHA-256)
        run: python packaging\fetch_core.py dist\Tropa\core

      - name: Тесты с настоящим ядром
        env:
          XRAY_BIN: ${{ github.workspace }}\dist\Tropa\core\xray.exe
          TROPA_REALITY_TARGET: www.microsoft.com:443
        run: python tests\run_ci.py

      - uses: actions/upload-artifact@v5
        with:
          name: tropa-dist
          path: dist/Tropa
          retention-days: 7

  # Установщик пакуем на Linux: NSIS из Ubuntu умеет 64-битные установщики (Windows-сборка NSIS — нет).
  installer:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: tropa-dist
          path: dist/Tropa

      - name: Установщик (NSIS)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis > /dev/null
          VERSION=$(python3 -c "from tropa import APP_VERSION; print(APP_VERSION)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          makensis -V2 -DAPP_VERSION="$VERSION" -DSRC_DIR="$PWD/dist/Tropa" \
            -DOUT_FILE="$PWD/dist/Tropa-Setup-$VERSION.exe" packaging/installer.nsi

      - uses: actions/upload-artifact@v5
        with:
          name: Tropa-Setup-${{ env.VERSION }}
          path: dist/Tropa-Setup-*.exe

      - name: Релиз (если это новая версия)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Релиз $TAG уже есть — публиковать нечего."
            exit 0
          fi
          FILE="dist/Tropa-Setup-$VERSION.exe"
          HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
          sed -e "s/{VERSION}/$VERSION/g" -e "s/{SHA256}/$HASH/g" packaging/release_notes.md > notes.md
          gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "Tropa $VERSION" --notes-file notes.md
